<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CHO RECO Lite">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3bb8f0">
<title>CHO RECO Lite</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- PWA Header -->
<div class="pwa-header">
  <div>
    <div class="pwa-header-text">CHO RECO Lite</div>
    <div class="pwa-header-sub">コード進行レコメンダー</div>
  </div>
</div>

<!-- Tab Bar -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('recommender')">🎵 レコメンド</button>
  <button class="tab-btn" onclick="switchTab('pad')">🎹 パッド</button>
</div>

<!-- ══════════════════════════════════════════════
     TAB 1: レコメンド
══════════════════════════════════════════════ -->
<div id="tab-recommender" class="tab-content active">

  <div class="card">
    <div class="card-title">① ジャンル</div>
    <div class="pill-group" id="genre-pills"></div>
    <div class="genre-desc" id="genre-desc"></div>
  </div>

  <div class="card">
    <div class="card-title">② キーと雰囲気</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <select id="key-select">
        <option value="C">C メジャー</option>
        <option value="D">D メジャー</option>
        <option value="E">E メジャー</option>
        <option value="F">F メジャー</option>
        <option value="G">G メジャー</option>
        <option value="A">A メジャー</option>
        <option value="Am">A マイナー</option>
        <option value="Em">E マイナー</option>
        <option value="Dm">D マイナー</option>
      </select>
      <select id="mood-select">
        <option value="all">すべての雰囲気</option>
        <option value="bright">☀ 明るい</option>
        <option value="dark">🌙 暗い</option>
        <option value="emotional">✨ エモい</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="card-title">③ 提案数</div>
    <div class="pill-group" id="count-pills">
      <button class="pill" data-count="3">3パターン</button>
      <button class="pill active" data-count="4">4パターン</button>
      <button class="pill" data-count="5">5パターン</button>
    </div>
  </div>

  <button class="btn-primary" onclick="doSuggest()">✦ この条件でパターンを提案する</button>

  <div id="results-area" style="margin-top:1rem"></div>
  <div id="empty-state" class="empty">ジャンル・キー・雰囲気を選んで<br>「提案する」ボタンを押してください</div>
</div>

<!-- ══════════════════════════════════════════════
     TAB 2: パッド
══════════════════════════════════════════════ -->
<div id="tab-pad" class="tab-content">
  <div id="pad-section" style="display:none">
    <div class="card">
      <div class="pad-header">
        <div class="pad-title" id="pad-pattern-name">—</div>
        <div class="pad-desc" id="pad-pattern-desc"></div>
      </div>
      <div class="pad-grid" id="pad-grid"></div>
    </div>
  </div>
  <div id="pad-empty" class="empty">レコメンドタブでパターンを選んで<br>「試す」ボタンを押してください</div>
</div>

<!-- ══ Scripts ══ -->
<script src="js/audio.js"></script>
<script src="js/recommender.js"></script>
<script src="js/pad.js"></script>

<script>
// ─── Tab switching ───────────────────────────
const TABS = ['recommender','pad'];
function switchTab(name) {
  TABS.forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === name);
  });
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', TABS[i] === name);
  });
}

// ─── Genre / count pills ──────────────────────
let selGenre = Object.keys(GENRE_META)[0];
let selCount = 4;

function renderGenrePills() {
  const wrap = document.getElementById('genre-pills');
  wrap.innerHTML = Object.keys(GENRE_META).map(gk => `
    <button class="pill ${gk === selGenre ? 'active' : ''}" data-genre="${gk}">${GENRE_META[gk].label}</button>
  `).join('');
  wrap.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => {
      selGenre = btn.dataset.genre;
      renderGenrePills();
    });
  });
  document.getElementById('genre-desc').textContent = GENRE_META[selGenre] ? GENRE_META[selGenre].desc : '';
}
renderGenrePills();

document.querySelectorAll('#count-pills .pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#count-pills .pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selCount = parseInt(btn.dataset.count);
  });
});

// ─── Suggest ─────────────────────────────────
function doSuggest() {
  const key = document.getElementById('key-select').value;
  const mood = document.getElementById('mood-select').value;
  const picked = suggest(selGenre, key, mood, selCount);

  document.getElementById('empty-state').style.display = 'none';
  const area = document.getElementById('results-area');

  if (!picked.length) {
    area.innerHTML = '';
    document.getElementById('empty-state').style.display = 'block';
    document.getElementById('empty-state').innerHTML = 'この条件に合うパターンが見つかりませんでした。<br>ジャンルや雰囲気を変えて試してください。';
    return;
  }

  area.innerHTML = picked.map((p, i) => {
    const moodTag = p.mood === 'bright' ? '☀ 明るい' : p.mood === 'dark' ? '🌙 暗い' : '✨ エモい';
    const chordCols = p.resolvedChords.map((ch, ci) => `
      <div class="chord-col">
        <div class="chord-box">
          <div class="chord-roman">${p.numerals[ci]}</div>
          <div class="chord-name">${ch}</div>
        </div>
      </div>`).join('');
    const noteHtml = p.note ? `<div class="detail-note">💡 ${p.note}</div>` : '';
    return `
    <div class="pattern-card ${i === 0 ? 'open' : ''}" id="rcard-${p.id}">
      <div class="pattern-header" onclick="toggleRCard('${p.id}')">
        <div class="pattern-num">${i + 1}</div>
        <div class="pattern-title-wrap">
          <div class="pattern-name">${p.name}</div>
          <div class="pattern-numerals-preview">${p.numerals.join(' - ')}</div>
        </div>
        <span class="tag">${moodTag}</span>
        <div class="chevron">▾</div>
      </div>
      <div class="pattern-body">
        <div class="chord-row">${chordCols}</div>
        <div style="font-size:12px;color:var(--text2);margin:10px 0 6px;line-height:1.6">${p.desc}</div>
        <div class="songs-wrap">
          <div class="songs-label">楽曲例</div>
          ${p.songs.map(s => `<span class="song-tag">${s}</span>`).join('')}
        </div>
        ${noteHtml}
        <button class="try-btn" onclick="openPad(${JSON.stringify(p).replace(/"/g,'&quot;')})">🎹 試す</button>
      </div>
    </div>`;
  }).join('');
}

function toggleRCard(id) {
  document.getElementById('rcard-' + id).classList.toggle('open');
}

// ─── Open pad from recommender ───────────────
function openPad(pattern) {
  showPad(pattern);
  switchTab('pad');
  document.getElementById('pad-empty').style.display = 'none';
}
</script>

</body>
</html>
